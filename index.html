:root{
  --bg:#070716;
  --surface:#12122c;
  --surface2:#1a1a3d;
  --raised:#25264f;
  --line:rgba(170,160,255,.17);

  --text:#f5f8fc;
  --muted:#9c9dc6;

  --gold:#8b5cf6;
  --gold2:#22d3ee;
  --gold-ink:#ffffff;

  --blue:#4f9cff;
  --blue2:#7bb8ff;

  --ok:#35d49a;
  --bad:#ff6d61;
  --warning:#f5bd55;

  --radius:22px;
  --glass:rgba(255,255,255,.045);

  font-family:
    "Inter",
    "Noto Sans Ethiopic",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    Roboto,
    sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  background:
    radial-gradient(circle at 15% -8%,rgba(34,211,238,.14) 0%,transparent 40%),
    radial-gradient(circle at 85% 0%,rgba(139,92,246,.12) 0%,transparent 42%),
    radial-gradient(circle at 50% 105%,rgba(34,211,238,.06) 0%,transparent 45%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100%;
  letter-spacing:-.1px;
}

body{
  padding:14px 14px calc(104px + env(safe-area-inset-bottom));
  max-width:480px;
  margin:0 auto;
  font-size:15px;
  line-height:1.45;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  cursor:pointer;
}

button:disabled{
  cursor:default;
}

.ic{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none;
}

.ic.sm{
  width:17px;
  height:17px;
}

h2{
  font-size:17px;
  font-weight:700;
  margin:20px 2px 10px;
}

p.muted,
.muted{
  color:var(--muted);
  font-size:13px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.between{
  justify-content:space-between;
}

.grow{
  flex:1;
  min-width:0;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid2 .card{
  margin:0;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.05),
      rgba(255,255,255,0) 60%
    ),
    var(--glass),
    var(--surface);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;

  box-shadow:
    0 14px 34px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.05);

  animation:cardIn .35s cubic-bezier(.2,.8,.2,1) both;
}

.hero{
  padding:22px 18px 19px;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 88% -10%,
      rgba(34,211,238,.22),
      transparent 42%
    ),
    radial-gradient(
      circle at 0% 110%,
      rgba(139,92,246,.14),
      transparent 45%
    ),
    linear-gradient(
      150deg,
      #16301f 0%,
      #0e1a13 60%,
      #0a120d 100%
    );

  border-color:rgba(34,211,238,.28);
}

.hero .amt{
  font-size:46px;
  font-weight:800;
  letter-spacing:-1.5px;
  font-variant-numeric:tabular-nums;
  line-height:1.05;
  margin-top:7px;
}

.hero .amt small{
  font-size:16px;
  color:var(--gold2);
  font-weight:700;
  letter-spacing:0;
  margin-left:6px;
}

.hero .etb{
  color:var(--muted);
  margin-top:5px;
}

.flame{
  width:44px;
  height:44px;
  border-radius:14px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      145deg,
      var(--gold2),
      var(--gold)
    );

  color:var(--gold-ink);

  box-shadow:
    0 8px 20px rgba(139,92,246,.15);
}

.flame .ic{
  width:24px;
  height:24px;
}

.badge{
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:99px;

  background:var(--raised);
  border:1px solid var(--line);
}

.badge.b1{
  color:#e6a66a;
}

.badge.b2{
  color:#dce5f2;
}

.badge.b3{
  color:var(--gold2);
}

.bar{
  height:8px;
  border-radius:99px;
  background:#0c0c26;
  overflow:hidden;
  margin:12px 0 6px;
}

.bar i{
  display:block;
  height:100%;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      var(--gold2)
    );

  border-radius:99px;
  transition:width .5s ease;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  width:100%;
  padding:14px 16px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );

  color:var(--gold-ink);

  font-weight:750;

  box-shadow:
    0 10px 24px rgba(139,92,246,.22),
    inset 0 1px 0 rgba(255,255,255,.35);

  transition:
    transform .15s ease,
    opacity .15s ease,
    filter .15s ease,
    box-shadow .15s ease;
}

.btn:hover{
  filter:brightness(1.06);
  box-shadow:
    0 12px 28px rgba(139,92,246,.3),
    inset 0 1px 0 rgba(255,255,255,.35);
}

.btn:active:not([disabled]){
  transform:scale(.97);
}

.btn.ghost{
  background:var(--raised);
  color:var(--text);
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

.btn.sm{
  width:auto;
  padding:9px 14px;
  border-radius:12px;
  font-size:13px;
}

.btn[disabled]{
  opacity:.4;
  box-shadow:none;
  filter:grayscale(.3);
}

input,
select,
textarea{
  width:100%;
  padding:12px 13px;

  border-radius:13px;

  background:#0c0c26;
  color:var(--text);

  border:1px solid var(--line);

  margin-top:6px;

  outline:none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(139,92,246,.08);
}

label{
  display:block;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;

  padding:13px 0;

  border-top:1px solid var(--line);
}

.item:first-child{
  border-top:0;
  padding-top:0;
}

.item:last-child{
  padding-bottom:0;
}

.item .muted{word-break:break-word}
.item .t{
  font-weight:650;
}

.pill{
  font-size:12px;
  font-weight:700;

  padding:4px 9px;

  border-radius:99px;

  background:rgba(139,92,246,.12);
  color:var(--gold2);
}

.pill.ok{
  background:rgba(53,212,154,.12);
  color:var(--ok);
}

.pill.bad{
  background:rgba(255,109,97,.12);
  color:var(--bad);
}

nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  display:flex;
  justify-content:center;

  padding:
    0
    14px
    calc(14px + env(safe-area-inset-bottom));

  z-index:20;

  pointer-events:none;
}

nav div{
  display:flex;
  width:100%;
  max-width:480px;
  pointer-events:auto;

  background:rgba(16,16,40,.86);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:1px solid var(--line);
  border-radius:20px;

  padding:6px;

  box-shadow:
    0 16px 34px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.06);
}

nav button{
  flex:1;

  background:none;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:4px;

  color:var(--muted);

  font-size:11px;

  padding:8px 0;

  border-radius:14px;

  transition:
    color .2s ease,
    background .2s ease,
    transform .15s ease;
}

nav button.on{
  color:var(--gold-ink);
  background:
    linear-gradient(
      135deg,
      var(--gold2),
      var(--gold)
    );
  box-shadow:0 6px 16px rgba(139,92,246,.28);
}

nav button:active{
  transform:scale(.94);
}

.navemoji{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  line-height:1;
}

.navemoji svg,
.cico{
  width:24px;
  height:24px;
  display:block;
  flex:none;
}

.st-wrap{
  min-height:78vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px 6px;
}

.st-icon{
  width:88px;
  height:88px;
  border-radius:26px;
  display:grid;
  place-items:center;
  margin-bottom:22px;
  border:1px solid rgba(255,255,255,.08);
}

.st-icon svg{
  width:48px;
  height:48px;
}

.st-icon.danger{
  background:rgba(255,93,97,.14);
  box-shadow:0 12px 34px rgba(255,93,97,.18);
}

.st-icon.warning{
  background:rgba(255,201,51,.14);
  box-shadow:0 12px 34px rgba(255,201,51,.16);
}

.st-icon.info{
  background:rgba(77,163,255,.14);
  box-shadow:0 12px 34px rgba(77,163,255,.16);
}

.st-badge{
  display:inline-block;
  margin:16px 0 4px;
  padding:6px 13px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.6px;
  color:#ff8d85;
  background:rgba(255,93,97,.14);
  border:1px solid rgba(255,93,97,.35);
}

.st-badge.warning{
  color:#ffd166;
  background:rgba(255,201,51,.12);
  border-color:rgba(255,201,51,.35);
}

.wheelbox{
  position:relative;
  width:min(78vw,300px);
  margin:8px auto 18px;
}

.pointer{
  position:absolute;

  left:50%;
  top:-8px;

  transform:translateX(-50%);

  width:0;
  height:0;

  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-top:20px solid var(--gold);

  z-index:2;

  filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));
}

#wheel{
  transition:transform 4s cubic-bezier(.12,.7,.1,1);
}

#wheel svg{
  width:100%;
  display:block;

  filter:
    drop-shadow(0 8px 22px rgba(0,0,0,.35));
}

.ticker{
  overflow:hidden;
  white-space:nowrap;

  background:var(--surface);

  border:1px solid var(--line);
  border-radius:13px;

  padding:8px 0;
  margin-bottom:6px;
}

.ticker span{
  display:inline-block;

  padding-left:100%;

  animation:
    tick 26s linear infinite;

  color:var(--muted);
  font-size:13px;
}

@keyframes tick{
  to{
    transform:translateX(-100%);
  }
}

@media(prefers-reduced-motion:reduce){
  .ticker span{
    animation:none;
    padding-left:12px;
  }

  #wheel{
    transition-duration:.01s;
  }
}

#gate,
#fatal{
  position:fixed;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(34,211,238,.12) 0%,
      transparent 42%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(139,92,246,.1) 0%,
      transparent 45%
    ),
    var(--bg);

  z-index:50;

  padding:
    calc(28px + env(safe-area-inset-top))
    18px
    24px;

  overflow:auto;

  display:none;
}

#gate .in,
#fatal .in{
  max-width:480px;
  margin:0 auto;
}

#gate h1,
#fatal h1{
  font-size:27px;
  line-height:1.15;
  letter-spacing:-.6px;
}

.loading-wrap{
  min-height:70vh;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;
}

.boot-logo{
  width:96px;
  height:96px;

  display:grid;
  place-items:center;

  border-radius:26px;

  background:
    linear-gradient(
      150deg,
      #22d3ee,
      #8b5cf6
    );

  font-size:44px;
  font-weight:800;
  color:#ffffff;

  box-shadow:
    0 0 0 1px rgba(34,211,238,.25),
    0 0 60px 14px rgba(139,92,246,.35);

  margin-bottom:18px;

  animation:
    bootPulse 2.2s ease-in-out infinite;
}

@keyframes bootPulse{
  0%,100%{
    box-shadow:
      0 0 0 1px rgba(34,211,238,.25),
      0 0 60px 14px rgba(139,92,246,.35);
  }
  50%{
    box-shadow:
      0 0 0 1px rgba(34,211,238,.35),
      0 0 78px 22px rgba(139,92,246,.5);
  }
}

.spinner{
  width:34px;
  height:34px;

  border:3px solid rgba(139,92,246,.18);
  border-top-color:#22d3ee;

  border-radius:50%;

  animation:
    sp .75s linear infinite;

  margin:25px auto;
}

.loading-title{
  font-weight:800;
  font-size:19px;
  margin-top:8px;
}

.loading-text{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

@keyframes sp{
  to{
    transform:rotate(360deg);
  }
}

.channel-loading{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  color:var(--muted);

  font-size:13px;

  padding:12px 0;
}

.mini-spinner{
  width:17px;
  height:17px;

  border:2px solid var(--line);
  border-top-color:#22d3ee;

  border-radius:50%;

  animation:sp .7s linear infinite;
}

.gate-top{
  margin-bottom:20px;
}

.gate-icon{
  width:52px;
  height:52px;

  display:grid;
  place-items:center;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      var(--gold2),
      var(--gold)
    );

  color:var(--gold-ink);

  margin-bottom:18px;

  box-shadow:
    0 10px 25px rgba(139,92,246,.15);
}

.gate-icon .ic{
  width:27px;
  height:27px;
}

.channel-card{
  background:var(--surface);

  border:1px solid var(--line);
  border-radius:18px;

  padding:4px 15px;

  margin-bottom:13px;
}

.channel-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

#toast{
  position:fixed;

  left:50%;

  bottom:
    calc(92px + env(safe-area-inset-bottom));

  transform:
    translateX(-50%)
    translateY(20px);

  background:#25264f;

  border:1px solid var(--line);

  padding:11px 18px;

  border-radius:14px;

  opacity:0;
  pointer-events:none;

  transition:.25s;

  z-index:60;

  max-width:88vw;

  text-align:center;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

#toast.show{
  opacity:1;
  transform:translateX(-50%);
}

.odds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.odds div{
  background:#0c0c26;
  border-radius:11px;
  padding:8px;
  text-align:center;
  font-size:13px;
}

.odds b{
  display:block;
  color:var(--gold2);
}

.empty{
  text-align:center;
  padding:15px 5px;
  color:var(--muted);
}

.success-text{
  color:var(--ok);
}

.warning-text{
  color:var(--warning);
}

.error-text{
  color:var(--bad);
}

@media(max-width:360px){
  body{
    padding-left:10px;
    padding-right:10px;
  }

  .hero .amt{
    font-size:40px;
  }

  .btn.sm{
    padding:7px 9px;
    font-size:12px;
  }
}

:root{
  --grad:linear-gradient(135deg,#22d3ee 0%,#8b5cf6 55%,#ec4899 100%);
  --grad-soft:linear-gradient(135deg,rgba(34,211,238,.18),rgba(139,92,246,.18),rgba(236,72,153,.14));
  --pink:#ec4899;
  --radius:24px;
}

html,body{
  background:
    radial-gradient(circle at 12% -6%,rgba(139,92,246,.32) 0%,transparent 42%),
    radial-gradient(circle at 92% 2%,rgba(34,211,238,.20) 0%,transparent 40%),
    radial-gradient(circle at 50% 108%,rgba(236,72,153,.16) 0%,transparent 46%),
    var(--bg);
  background-attachment:fixed;
}

h2{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:17px;
}
h2::before{
  content:"";
  width:5px;
  height:18px;
  border-radius:4px;
  background:var(--grad);
}

.card{
  border-radius:24px;
  border:1px solid rgba(190,180,255,.16);
  background:
    linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,0) 55%),
    var(--surface);
  box-shadow:0 16px 38px rgba(2,2,20,.5),inset 0 1px 0 rgba(255,255,255,.07);
}

.hero{
  border-color:rgba(167,139,250,.4);
  background:
    radial-gradient(circle at 90% -10%,rgba(34,211,238,.32),transparent 44%),
    radial-gradient(circle at 0% 115%,rgba(236,72,153,.26),transparent 48%),
    linear-gradient(150deg,#2f2377 0%,#1a1650 58%,#100e33 100%);
}
.hero .amt{
  background:linear-gradient(90deg,#ffffff,#c4b5fd 60%,#67e8f9);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.hero .amt small{
  -webkit-text-fill-color:#67e8f9;
}

.btn{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  border-radius:999px;
  padding:15px 22px;
  font-weight:800;
  letter-spacing:.2px;
  color:#fff;
  text-shadow:0 1px 2px rgba(20,10,60,.35);
  background:linear-gradient(120deg,#22d3ee,#8b5cf6 52%,#ec4899);
  background-size:180% 100%;
  background-position:0% 50%;
  border:1px solid rgba(255,255,255,.28);
  box-shadow:
    0 12px 28px rgba(139,92,246,.45),
    0 2px 0 rgba(255,255,255,.28) inset,
    0 -3px 8px rgba(30,10,90,.28) inset;
  transition:transform .16s ease,box-shadow .2s ease,background-position .5s ease,filter .2s ease;
}
.btn::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:-60%;
  width:45%;
  transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  animation:btnShine 3.6s ease-in-out infinite;
  z-index:-1;
}
@keyframes btnShine{
  0%,55%{left:-60%}
  100%{left:130%}
}
.btn:hover{
  background-position:100% 50%;
  filter:brightness(1.07);
  box-shadow:0 16px 34px rgba(139,92,246,.55),0 2px 0 rgba(255,255,255,.3) inset,0 -3px 8px rgba(30,10,90,.28) inset;
}
.btn:active:not([disabled]){
  transform:translateY(2px) scale(.975);
  box-shadow:0 5px 14px rgba(139,92,246,.4),0 2px 0 rgba(255,255,255,.2) inset;
}
.btn .ic{
  width:19px;
  height:19px;
}
.btn.ghost{
  color:var(--text);
  text-shadow:none;
  background:linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid rgba(190,180,255,.32);
  box-shadow:0 8px 20px rgba(2,2,20,.4),0 1px 0 rgba(255,255,255,.12) inset;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.btn.ghost::after{
  display:none;
}
.btn.ghost:hover{
  border-color:#22d3ee;

function deviceId(){

  try{

    let d = localStorage.getItem('did');

    if(!d){

      d =
        (
          crypto.randomUUID
            ? crypto.randomUUID()
            : String(Math.random()).slice(2) + Date.now()
        )
        .replace(/-/g,'');

      localStorage.setItem('did',d);
    }

    return d;

  }catch(e){

    return 'nostore';

  }

}

function errMsg(e){

  if(e && e.code === 'cooldown'){

    return `Wait ${
      e.data && e.data.wait
        ? e.data.wait
        : 30
    }s before the next ad.`;

  }

  return (
    ERR[e && e.code] ||
    ERR[e && e.message] ||
    (
      e &&
      e.message === 'Failed to fetch'
        ? ERR.timeout
        : e && e.message
    ) ||
    ERR.server
  );

}

async function api(path,body){

  const c = new AbortController();

  const to = setTimeout(
    () => c.abort(),
    20000
  );

  try{

    const r = await fetch(
      API + path,
      {
        method: body ? 'POST' : 'GET',

        signal:c.signal,

        headers:{
          'Content-Type':'application/json',

          'x-init-data':
            (tg && tg.initData) || '',

          'x-device':
            deviceId()
        },

        body:
          body
            ? JSON.stringify(body)
            : undefined
      }
    );

    const j =
      await r.json().catch(
        () => ({})
      );

    if(
      r.status === 403 &&
      j.error === 'gate'
    ){

      openGate();

      throw Object.assign(
        new Error('gate'),
        {code:'gate'}
      );

    }

    if(
      r.status === 403 &&
      j.error === 'banned'
    ){

      statusScreen(describeBan(j.reason));

      throw Object.assign(
        new Error('banned'),
        {code:'banned'}
      );

    }

    if(!r.ok){

      throw Object.assign(
        new Error(j.error || 'server'),
        {
          code:j.error,
          data:j
        }
      );

    }

    return j;

  }catch(e){

    if(e.name === 'AbortError'){

      throw Object.assign(
        new Error('timeout'),
        {code:'timeout'}
      );

    }

    throw e;

  }finally{

    clearTimeout(to);

  }

}

function describeBan(reason){

  const r = String(reason || '').toLowerCase();

  if(r.includes('vpn') || r.includes('proxy') || r.includes('tor')){

    return {
      type:'danger',
      icon:'shieldx',
      title:'Access blocked',
      desc:'A VPN or proxy connection was detected. Your account has been permanently banned.',
      badge:'VPN / PROXY DETECTED'
    };

  }

  if(r.includes('multiple') || r.includes('same device') || r.includes('same ip')){

    return {
      type:'danger',
      icon:'users',
      title:'Access blocked',
      desc:'Multiple Telegram accounts were detected from this device or network. Only one account is allowed.',
      badge:'MULTIPLE ACCOUNTS DETECTED'
    };

  }

  return {
    type:'danger',
    icon:'ban',
    title:'Account banned',
    desc:'Your account has been permanently banned from Adewa.',
    badge:'BANNED'
  };

}

async function verifyOnce(){

  const c = new AbortController();
  const to = setTimeout(() => c.abort(), 15000);

  try{

    const r = await fetch(
      API + '/api/auth',
      {
        method:'POST',
        signal:c.signal,
        headers:{
          'Content-Type':'application/json',
          'x-init-data':(tg && tg.initData) || '',
          'x-device':deviceId()
        }
      }
    );

    const d = await r.json().catch(() => ({}));

    if(d.status === 'banned' || d.error === 'banned'){
      return { screen:describeBan(d.reason) };
    }

    if(d.ok && d.status === 'verified'){
      return { ok:true };
    }

    return {
      screen:{
        type:'warning',
        icon:'xcircle',
        title:'Verification failed',
        desc:d.message || 'Something went wrong. Please try again.',
        retry:true
      }
    };

  }catch(e){

    const timedOut = e && e.name === 'AbortError';
    const detail = e && e.message ? ' (' + e.message + ')' : '';

    return {
      screen:{
        type:'warning',
        icon:'wifi',
        title:timedOut ? 'Connection timed out' : 'Connection error',
        desc:timedOut
          ? 'The server took too long to respond.'
          : 'Could not reach the server' + detail + '.',
        retry:true
      }
    };

  }finally{

    clearTimeout(to);

  }

}

async function verifyAccount(){

  let r = await verifyOnce();

  for(let i = 0; i < 2 && !r.ok && r.screen && r.screen.retry; i++){

    await sleep(1500);

    r = await verifyOnce();

  }

  return r;

}

function channelUrl(chat){

  if(!chat) return '#';

  let s = String(chat).trim();

  if(/^https?:\/\//i.test(s)){

    return s;

  }

  s = s.replace(/^@/,'').trim();

  return 'https://t.me/' + s;

}

function joinCh(i){

  if(
    !GATE ||
    !GATE.channels ||
    !GATE.channels[i]
  ) return;

  const c =
    GATE.channels[i];

  const url =
    c.url ||
    channelUrl(c.chat);

  if(
    tg &&
    tg.openTelegramLink
  ){

    tg.openTelegramLink(url);

  }else{

    window.open(
      url,
      '_blank'
    );

  }

  setTimeout(
    () => recheckGate(),
    1800
  );

}

function startGateAutoCheck(){

  stopGateAutoCheck();

  gateTimer =
    setInterval(
      async ()=>{

        if(
          !gateOpen ||
          gateChecking
        ) return;

        await silentGateCheck();

      },
      3000
    );

}

function stopGateAutoCheck(){

  if(gateTimer){

    clearInterval(gateTimer);

    gateTimer = null;

  }

}

async function silentGateCheck(){

  if(gateChecking) return;

  gateChecking = true;

  try{

    const g =
      await loadGate(true);

    GATE = g;

    renderGate();

    if(g.ok){

      haptic();

      stopGateAutoCheck();

    }

  }catch(e){

  }finally{

    gateChecking = false;

  }

}

async function recheckGate(){

  if(gateChecking) return;

  gateChecking = true;

  renderGateLoading();

  try{

    GATE =
      await loadGate(true);

    renderGate();

    if(GATE.ok){

      haptic();

    }

  }catch(e){

    toast(errMsg(e));

    renderGateError();

  }finally{

    gateChecking = false;

  }

}

async function enterApp(){

  if(!GATE || !GATE.ok){

    await recheckGate();

    if(!GATE || !GATE.ok){

      return;

    }

  }

  stopGateAutoCheck();

  $('#gate').style.display = 'none';

  gateOpen = false;

  await boot();

}

async function boot(){

  if(
    !tg ||
    !tg.initData
  ){

    fatal(
      'Open this app from the Telegram bot.'
    );

    return;

  }

  try{

    /* step 1: required channels */
    const g = await loadGate(false);

    GATE = g;

    if(!g.ok){
      openGate();
      return;
    }

    /* step 2: multi-account / VPN verification */
    const v = await verifyAccount();

    if(!v.ok){
      statusScreen(v.screen);
      return;
    }


    await loadMe();

    $('#nav').style.display =
      'block';

    go(TAB);

    if(
      typeof show_11849985 === 'function' &&
      !window.__inapp
    ){

      window.__inapp = true;

      try{

        show_11849985({
          type:'inApp',

          inAppSettings:{
            frequency:2,
            capping:0.1,
            interval:30,
            timeout:5,
            everyPage:false
          }

        });

      }catch(e){}

    }

  }catch(e){

    if(
      e.code !== 'gate' &&
      e.code !== 'banned'
    ){

      fatal(
        errMsg(e)
      );

    }

  }

}

  };

    ['home','home',t('tab_home')],

    ['spin','spin',t('tab_spin')],
    ['invite','users',t('tab_invite')],

  ];

  if(
    ME &&
    ME.is_admin
  ){

  $('#navin').innerHTML =
    tabs.map(
      ([id,i,l]) => `

        <button
          class="${TAB === id ? 'on' : ''}"

async function go(tab){

  TAB = tab;

  drawNav();

  window.scrollTo(
    0,
    0
  );

  try{

    if(tab === 'earn'){

      TASKS =
        (
          await api('/api/tasks')
        ).tasks;

    }

    if(tab === 'spin'){

      WINNERS =
        (
          await api('/api/winners')
        ).winners;

    }

    if(tab === 'invite'){

      const lb =
        await api('/api/leaderboard');

      TOP = lb.top;
      INVITERS = lb.inviters || [];
      EARNERS = lb.earners || [];

    }

    if(tab === 'wallet'){

      WDS =
        (
          await api('/api/withdrawals')
        ).items;

    }

    if(tab === 'admin'){

      ADMIN =
        await api('/api/admin/overview');

    }

  }catch(e){

    if(
      e.code !== 'gate'
    ){

      toast(
        errMsg(e)
      );

    }

  }

  render();

}

function segs(kind){

  const s =
    ME.cfg.spin;

  const list =
    kind === 'free'

      ? s.free_prizes

      : [
          ...new Set(
            s.paid_odds.map(
              (r)=>r[0]
            )
          )
        ].sort(
          (a,b)=>a-b
        );

  const out = [];

  for(
    let i=0;
    i<8;
    i++
  ){

    out.push(
      list[i % list.length]
    );

  }

  return out;

}

function buildWheel(kind){

  wheelKind =
    kind;

  const arr =
    segs(kind);

  const R = 96;

  const cols = [
    '#18304e',
    '#254a78',
    '#3a2a12',
    '#5a4216'
  ];

  const pt =
    (a)=>[
      100 + R * Math.sin(a),
      100 - R * Math.cos(a)
    ];

  let svg =
    `
      <svg viewBox="0 0 200 200">

        <circle
          cx="100"
          cy="100"
          r="99"
          fill="#08111f"
          stroke="#16c777"
          stroke-width="2"
        />
    `;

  arr.forEach(
    (p,i)=>{

      const a1 =
        (i * 45) *
        Math.PI /
        180;

      const a2 =
        ((i + 1) * 45) *
        Math.PI /
        180;

      const [
        x1,
        y1
      ] = pt(a1);

      const [
        x2,
        y2
      ] = pt(a2);

      svg += `

        <path
          d="
            M100,100
            L${x1},${y1}
            A${R},${R}
            0 0 1
            ${x2},${y2}
            Z
          "
          fill="${
            p === 0
              ? cols[0]
              : (
                i % 2
                  ? cols[1]
                  : cols[3]
              )
          }"
          stroke="#08111f"
          stroke-width="1"
        />

        <text
          x="100"
          y="34"
          transform="
            rotate(
              ${i * 45 + 22.5}
              100
              100
            )
          "
          text-anchor="middle"
          font-size="14"
          font-weight="700"
          fill="${
            p === 0
              ? '#8fa3bf'
              : '#4bffa0'
          }"
        >
          ${p}
        </text>

      `;

    }
  );

  svg += `
      <circle
        cx="100"
        cy="100"
        r="10"
        fill="#16c777"
      />

      </svg>
  `;

  const w =
    $('#wheel');

  if(!w) return;

  w.style.transition =
    'none';

  w.style.transform =
    'rotate(0deg)';

  rot = 0;

  w.innerHTML =
    svg;

}

async function doSpin(kind){

  if(busy) return;

  busy = true;

  $('#fbtn').disabled =
    true;

  $('#pbtn').disabled =
    true;

  try{

    const r =
      await api(
        '/api/spin',
        {kind}
      );

    buildWheel(kind);

    const arr =
      segs(kind);

    const idxs =
      arr
        .map(
          (p,i)=>
            p === r.prize
              ? i
              : -1
        )
        .filter(
          (i)=>i >= 0
        );

    const idx =
      idxs.length
        ? idxs[
            Math.floor(
              Math.random() *
              idxs.length
            )
          ]
        : 0;

    const w =
      $('#wheel');

    void w.offsetWidth;

    const target =
      360 * 5 +
      (
        (
          360 -
          (
            idx * 45 +
            22.5
          )
        ) % 360
      );

    w.style.transition =
      '';

    w.style.transform =
      `rotate(${target}deg)`;

    await sleep(4200);

    ME.user.coins =
      r.coins;

    ME.cfg.spin.free_left =
      r.free_left;

    if(r.prize > 0){

      haptic();

      toast(
        `You won ${r.prize} coins`
      );

    }else{

      toast(
        'No prize this time'
      );

    }

    const t =
      $('#fbtn');

    const p =
      $('#pbtn');

    t.disabled =
      !r.free_left;

    t.innerHTML =
      `${ic('spin')}
       Free spin (${r.free_left} left)`;

    p.disabled =
      r.coins <
      ME.cfg.spin.cost;

  }catch(e){

    if(
      e.code !== 'gate'
    ){

      toast(
        errMsg(e)
      );

    }

    const t =
      $('#fbtn');

    if(t){

      t.disabled =
        !ME.cfg.spin.free_left;

      $('#pbtn').disabled =
        ME.user.coins <
        ME.cfg.spin.cost;

    }

  }

  busy = false;

}

function methodLabel(m){

  m = String(m || '').toLowerCase();

  if(m === 'bep20') return 'USDT · BEP20';
  if(m === 'ton') return 'TON';
  if(m === 'cbe') return 'CBE';
  if(m === 'telebirr') return 'Telebirr';
  if(m === 'mpesa') return 'Mpesa';

  return m ? m.charAt(0).toUpperCase() + m.slice(1) : '';

}

function explorerUrl(method, hash){

  if(!hash) return '';

  return String(method).toLowerCase() === 'bep20'
    ? 'https://bscscan.com/tx/' + hash
    : 'https://tonviewer.com/transaction/' + hash;

}

function openExplorer(url){

  if(!url) return;

  if(tg && tg.openLink) tg.openLink(url);
  else window.open(url, '_blank');

}

function openGroup(){

  const link = ME.cfg.withdraw.group_link;

  if(!link) return;

  if(tg && tg.openTelegramLink && /^https:\/\/t\.me\//.test(link)) tg.openTelegramLink(link);
  else if(tg && tg.openLink) tg.openLink(link);
  else window.open(link, '_blank');

}

function withdrawQuote(){

  const el = $('#wquote');
  const m = String(($('#wmeth') || {}).value || '').toLowerCase();

  if(!el) return;

  if(m !== 'bep20' && m !== 'ton'){
    el.textContent = '';
    return;
  }

  const w = ME.cfg.withdraw;
  const etbAmt = Number(($('#wamt') || {}).value);

  if(!(etbAmt > 0) || !(w.etb_per_usd > 0)){
    el.textContent = 'Paid automatically after admin approval.';
    return;
  }

  const fee = Number(w.fee_percent || 0);
  const usd = (etbAmt * (1 - fee / 100)) / w.etb_per_usd;

  if(m === 'bep20'){
    el.textContent = `You receive about ${usd.toFixed(2)} USDT (after ${fee}% fee).`;
  }else if(w.ton_usd > 0){
    el.textContent = `You receive about ${(usd / w.ton_usd).toFixed(3)} TON (after ${fee}% fee).`;
  }else{
    el.textContent = `About ${usd.toFixed(2)} USD, paid in TON at the live rate (after ${fee}% fee).`;
  }

}

function withdrawMethodChanged(){

  const m = String(($('#wmeth') || {}).value || '').toLowerCase();
  const input = $('#wacc');
  const help = $('#whelp');
  const lbl = $('#wacclbl');
  const owner = $('#wownerbox');

  if(!input || !help) return;

  const crypto = m === 'bep20' || m === 'ton';

  if(owner) owner.style.display = crypto ? 'none' : '';

  if(lbl){
    lbl.textContent = crypto ? 'Wallet address' : 'Account / phone number';
  }

  input.setAttribute('inputmode', crypto ? 'text' : 'numeric');

  if(m === 'bep20'){
    input.placeholder = '0x...';
    help.textContent = 'BEP20 (BNB Smart Chain) address only. USDT sent to a wrong network is lost.';
  }else if(m === 'ton'){
    input.placeholder = 'UQ... or EQ...';
    help.textContent = 'TON wallet address. If your wallet needs a memo/tag, use a wallet that does not.';
  }else if(m === 'telebirr'){
    input.placeholder = '09XXXXXXXX';
    help.textContent = 'Telebirr: exactly 10 digits, starts with 09.';
  }else if(m === 'mpesa'){
    input.placeholder = '07XXXXXXXX';
    help.textContent = 'Mpesa: exactly 10 digits, starts with 07.';
  }else{
    input.placeholder = '1000XXXXXXXXX';
    help.textContent = 'CBE: exactly 13 digits, starts with 1000 or 10000.';
  }

  withdrawQuote();

}

async function withdraw(){

  if(busy) return;

  busy = true;

  try{

    await api(
      '/api/withdraw',
      {
        etb:$('#wamt').value,
        method:$('#wmeth').value,
        account:$('#wacc').value,
        holder_name:$("#wowner").value.trim()
      }
    );

    haptic();

    toast(
      'Request sent successfully.'
    );

    await loadMe();

    WDS =
      (
        await api(
          '/api/withdrawals'
        )
      ).items;

    render();

  }catch(e){

    if(
      e.code !== 'gate'
    ){

      toast(
        errMsg(e)
      );

    }

  }

  busy = false;

}

async function addChannel(){

  const link = (($('#ch_link') || {}).value || '').trim();
  const reward = (($('#ch_reward') || {}).value || '').trim();

  if(!title) return toast('Write the channel name.');
  if(!link) return toast('Paste the channel link.');
  if(reward === '' || Number(reward) < 0) return toast('Write the reward in coins.');

  await adm('/api/admin/channel', { action:'add', title, link, reward:Number(reward) }, 'Channel added');

}

async function sendBroadcast(){

}

function saveSetting(k){

let v;

const raw = $('#s_' + k).value.trim();

try{

v = JSON.parse(raw);

}catch(e){

if(k === 'support_bot_username'){

  v = raw.replace(/^@/, '');

}else if(
  raw &&
  !/^[\[{]/.test(raw)
){

  v = raw;

}else{

  return toast(
    'Invalid format'
  );

}

}

return setSetting(
k,
v
);

}


/* =========================================================
   PASSIVE AD: any button tap (never blocks the button itself)
========================================================= */

document.addEventListener('click', (e) => {

  try{

    const b = e.target && e.target.closest
      ? e.target.closest('button, .btn, [onclick]')
      : null;

    if(!b || b.disabled) return;
    if(document.getElementById('welcome')) return;
    if(typeof TAB !== 'undefined' && TAB === 'admin') return;

    const oc = String(b.getAttribute('onclick') || '');

    /* the reward-ad button already shows its own ad */
    if(/watchAd\(/.test(oc)) return;

    showInterstitialAd('tap');

  }catch(err){}

}, { passive:true, capture:true });


/* =========================================================
   AUTO REFRESH: after 30 seconds without any touch
========================================================= */

let LAST_TOUCH = Date.now();
let idleBusy = false;

['touchstart','pointerdown','click','keydown','scroll'].forEach(ev => {

  document.addEventListener(
    ev,
    () => { LAST_TOUCH = Date.now(); },
    { passive:true, capture:true }
  );

});

setInterval(async () => {

  if(Date.now() - LAST_TOUCH < 30000) return;
  if(document.hidden || idleBusy || busy) return;
  if(document.getElementById('welcome')) return;

  /* never disturb someone who is typing / has typed something */
  const a = document.activeElement;

  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;

  if(
    Array.from(document.querySelectorAll('#app input, #app textarea'))
      .some(i => i.value && i.type !== 'hidden')
  ){
    return;
  }

  idleBusy = true;
  LAST_TOUCH = Date.now();

  /* 30s with no touch -> passive ad */
  if(
    idleAdsShown < MAX_IDLE_ADS &&
    (typeof TAB === 'undefined' || TAB !== 'admin')
  ){
    idleAdsShown++;
    showInterstitialAd('idle');
  }

  try{

    if(gateOpen){

      await silentGateCheck();

    }else if(ME && TAB !== 'admin' && $('#nav').style.display !== 'none'){

      await loadMe();

      if(TAB === 'wallet'){
        WDS = (await api('/api/withdrawals')).items;
      }

      render();

    }

  }catch(e){}

  idleBusy = false;

}, 5000);

function hideWelcome(){
  const w = document.getElementById('welcome');
  if(!w || w.classList.contains('out')) return;
  w.classList.add('out');
  setTimeout(() => { try{ w.remove(); }catch(e){} }, 800);
}
setTimeout(hideWelcome, 12000);
Promise.all([
  boot().catch(() => {}),
  sleep(2400)
]).then(hideWelcome);
